<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#000000"><title>Icthus · Pantalla de proyección</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./styles.css"><style>html,body{height:100%;width:100%;overflow:hidden;background:#000}.projection-screen{height:100dvh;width:100vw;border:0;border-radius:0;aspect-ratio:auto}.projection-toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 12px;background:#17151fe8;border:1px solid #7c6b9144;border-radius:10px;opacity:0;transition:opacity .2s;z-index:10;white-space:nowrap}.show-controls .projection-toolbar,.projection-toolbar:focus-within{opacity:1}.projection-toolbar .button{min-height:35px;font-size:.8125rem}.projection-notice{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:.8125rem;background:#181520db;border:1px solid #6e587444;color:#c1b5d1;padding:10px 16px;border-radius:8px;z-index:10;transition:opacity .2s}.hide-notice .projection-notice{opacity:0;pointer-events:none}.projection-error{position:fixed;top:18px;left:20px;right:20px;text-align:center;color:#eee;background:#462a37;padding:14px;border-radius:8px;font-size:.875rem;z-index:20}</style></head><body class="show-controls"><main id="screen" class="slide-stage projection-screen" data-theme="indigo" aria-label="Pantalla de proyección"></main><div class="projection-notice" id="projectionNotice">Mueve esta ventana a la pantalla de la iglesia.</div><div class="projection-toolbar"><button class="icon-button" id="previous" aria-label="Diapositiva anterior"><svg><use href="./icons.svg#chevron-left"/></svg></button><button class="button secondary" id="fullscreen"><svg><use href="./icons.svg#expand"/></svg>Pantalla completa</button><button class="icon-button" id="black" aria-label="Activar o quitar pantalla negra"><svg><use href="./icons.svg#black"/></svg></button><button class="icon-button" id="next" aria-label="Diapositiva siguiente"><svg><use href="./icons.svg#chevron-right"/></svg></button></div><p id="projectionError" class="projection-error" hidden></p><script type="module" src="./projection.js"></script></body></html>
